[package]
name = "turbovec-service"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "Rust service-layer API for turbovec vector indexes"
license = "MIT"
repository = "https://github.com/KkSss999/turbovec-ts"
publish = false

[lib]
name = "turbovec_service"
path = "src/lib.rs"

[dependencies]
turbovec-core = { package = "turbovec", version = "1.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
